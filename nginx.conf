server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the whole /api/* namespace, not a hand-maintained allowlist: an
    # enumerated list silently 404s (falls through to the SPA -> HTML -> the
    # client's JSON.parse fails) every time the backend or frontend gains a
    # resource the list forgot. homework, messages, and questions were all
    # already broken this way.
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://hezarfen-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
