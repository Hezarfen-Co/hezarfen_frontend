services:
  frontend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/hezarfen-frontend:latest
    container_name: hezarfen-frontend
    ports:
      - "5173:5173"
    environment:
      PORT: "5173"
      # Remote backend origin; server.ts keeps browser traffic same-origin.
      BACKEND_ORIGIN: "${BACKEND_ORIGIN:-https://hezarfen.dizey.sh}"
    restart: unless-stopped
    healthcheck:
      # Bun-based: the slim runtime image ships no curl.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
