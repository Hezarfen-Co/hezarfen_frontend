services:
  frontend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/hezarfen-frontend:latest
    container_name: hezarfen-frontend
    ports:
      - "5173:5173"
    environment:
      PORT: "5173"
      # Backend on the shared compose network; server.ts proxies /api here.
      BACKEND_ORIGIN: "http://hezarfen-backend:8080"
    restart: unless-stopped
    healthcheck:
      # Bun-based: the slim runtime image ships no curl.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hezarfen_backend_default

networks:
  hezarfen_backend_default:
    external: true
