<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hezarfen</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("hezarfen.theme");
          const dark =
            theme === "dark" ||
            (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-kb-theme", dark ? "dark" : "light");
          if (dark) document.documentElement.classList.add("dark");
          const locale = localStorage.getItem("hezarfen.locale");
          if (locale === "en" || locale === "tr") document.documentElement.lang = locale;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
