<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget is set at runtime, Android-only (see below): a static
         key logs "not recognized" on desktop browsers, while Android Chrome
         needs resizes-content so the soft keyboard resizes the layout viewport
         and a fixed composer's field stays above the keys. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Repainted from --background by preferences-context on every theme
         change; this literal is only the value the first paint uses. -->
    <meta name="theme-color" content="#f7f7f7" />
    <meta
      name="description"
      content="Hezarfen; eğitim, ders, sınav, ödev, takvim ve kampüs işlemlerini tek yerde yöneten güvenli öğrenme platformudur."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hezarfen</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("hezarfen.theme");
          const dark =
            theme === "dark" ||
            (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-kb-theme", dark ? "dark" : "light");
          if (dark) document.documentElement.classList.add("dark");
          // The stylesheet has not loaded yet, so these repeat --background /
          // --background(dark) as literals. Keep them in step with index.css.
          document.documentElement.style.backgroundColor = dark ? "#0f0f0f" : "#f7f7f7";
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", dark ? "#0f0f0f" : "#f7f7f7");
          const locale = localStorage.getItem("hezarfen.locale");
          if (locale === "en" || locale === "tr") document.documentElement.lang = locale;
          // interactive-widget is Android-Chrome-only: appending it here keeps
          // desktop browsers from logging "viewport argument key not
          // recognized", while Android keeps resizes-content so the soft
          // keyboard resizes the layout viewport instead of just the visual
          // one. Runs before first paint, next to the other viewport setup.
          if (/android/i.test(navigator.userAgent)) {
            const viewport = document.querySelector('meta[name="viewport"]');
            if (viewport) viewport.setAttribute("content", viewport.getAttribute("content") + ", interactive-widget=resizes-content");
          }
          // Android reports only the display cutout through CSS env(), so the
          // gesture bar is invisible to the page. The Tauri shell exposes its
          // height here; read before first paint so nothing renders under it.
          // Absent in a browser, where env(safe-area-inset-bottom) is enough.
          const shell = window.HezarfenShell;
          if (shell && typeof shell.bottomInsetPx === "function") {
            document.documentElement.style.setProperty("--android-nav-inset", shell.bottomInsetPx() + "px");
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
